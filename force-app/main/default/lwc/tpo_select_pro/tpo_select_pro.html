<template>
    <div class="mainContainer">
        
        <!-- Go Back and University Information -->
        <div class="d-flex">            
            <div class="go-back" onclick={handleGoBack}>
                <img src={goBackArrowIcon} alt="Go Back" style="width: 20px; height: 20px; margin-right: 5px;" />
                <a href="javascript:void(0);" style="color: #000; margin-left: -9px; font-family: Poppins; font-size: 14px; font-weight: 400;">Go Back</a>
            </div>
                        
            <div class="align-buttons">
                <div class="university-info" style="margin-left: 10px;">
                    <p>University Name / ID: KLC Tech College</p>
                </div>
            </div>
        </div>

        <!-- Filter Section (outside the table) -->
        <div class="slds-grid slds-wrap filter-section" style="align-items: center; gap: 5px;">
          
            <!-- Program Name Dropdown -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-6 programComboBox" style="flex-grow: 0;">
                <lightning-combobox
                    name="program"
                    label="Program Name"
                    value={selectedProgram}
                    placeholder="Select Program"
                    options={programOptions}
                    onchange={handleProgramChange}
                    style="width:306px;height: 34px;">
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 courseComboBox" style="flex-grow: 0;margin-bottom: 40px;">
                <lightning-combobox
                    name="course"
                    value={selectedCourse}
                    placeholder="Select course"
                    options={courseOptions}
                    onchange={handleCourseChange}
                    style="width:306px;height: 35px;">
                </lightning-combobox>
            </div>
            <!-- Search Button -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-6 searchButton" style="flex-grow: 0; text-align: center;">
                <lightning-button label="Search" variant="brand" onclick={handleSearch} style="width: 86px; height: 34px;"></lightning-button>
            </div>
        </div>
        
        <!-- Student Table -->
        <div class="slds-modal__content" style="max-height: 400px; overflow-y: auto; overflow-x: auto;padding-top: 30px;">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-no-row-hover" aria-label="Example table of Opportunities with vertical borders">
                <thead>
                    <tr class="slds-line-height_reset table-header">
                        <th scope="col" style="background-color: #FFFECE;">S. No</th>
                        <th scope="col" style="background-color: #FFFECE;">Program Name</th>
                        <th scope="col" style="background-color: #FFFECE;">Total No:of courses</th>
                        <th scope="col" style="background-color: #FFFECE;">Total students</th>
                    </tr>
                </thead>
                <tbody> 
                    <template for:each={visibleRecords} for:item="program" for:index="index">
                        <tr key={program.id}>
                            <td>{program.id}</td>
                            <td>{program.Name}</td>
                            <td>{program. noofcourses }</td>   
                            <td>{program.totalstudents}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <c-pagination2 record-size="5" records={allRecords} onupdate={handleUpdate}></c-pagination2>
    </div>
</template>
